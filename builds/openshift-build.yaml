apiVersion: shipwright.io/v1beta1
kind: Build
metadata:
  name: todo-application-build
spec:
  source:
    type: Git
    git:
      url: https://github.com/secangkirkopipanas/todo-application.git
    contextDir: .

  strategy:
    name: source-to-image
    kind: ClusterBuildStrategy

  paramValues:
    - name: builder-image
      value: >-
        registry.access.redhat.com/ubi9/openjdk-21@sha256:8850bf737906dac2035a598d6a47507887e34d0f0870932ef54a42f974a5126f

  output:
    image: quay.io/repository/rh_rh/todo-java:latest
    pushSecret: quay-pull-secret
